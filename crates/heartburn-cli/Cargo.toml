[package]
name = "heartburn-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone debugging and local testing CLI for heartburn-core"

[[bin]]
name = "heartburn"
path = "src/main.rs"

[features]
default = []
firefox-tls = ["heartburn-core/firefox-tls"]

[dependencies]
base64.workspace = true
clap.workspace = true
heartburn-core = { path = "../heartburn-core" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
