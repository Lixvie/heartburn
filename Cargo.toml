[workspace]
resolver = "2"
members = [
    "crates/heartburn-core",
    "crates/heartburn-ffi",
    "crates/heartburn-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
aes-gcm = "0.10"
base64 = "0.22"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1.2"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "tokio"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
percent-encoding = "2.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
ring = "0.17"
rustls = { version = "0.23.25", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.44", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uniffi = { version = "0.29", features = ["cli"] }
url = "2.5"
webpki-roots = "1.0"

# Optional BoringSSL backend for exact Firefox 158 TLS fingerprinting (feature `firefox-tls`)
boring2 = { version = "4", features = ["pq-experimental"] }
brotli-decompressor = "6.2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio-boring2 = "4"

# Ensure BoringSSL C/C++ builds against the release MSVC CRT (/MD) matching rustc
# even in dev/test builds, avoiding MSVCRTD / __imp__CrtDbgReport link errors on Windows.
[profile.dev.package.boring-sys2]
opt-level = 2
